<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Advanced Task Management Dashboard</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    color:white;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.title{
    font-size:32px;
    font-weight:600;
}

.theme-btn{
    padding:10px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#38bdf8;
    color:white;
    font-weight:600;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    font-size:18px;
    margin-bottom:10px;
}

.card p{
    font-size:28px;
    font-weight:bold;
}

.main{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:25px;
}

.task-section,
.analytics{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    padding:25px;
    border-radius:20px;
}

.task-form{
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:10px;
    margin-bottom:25px;
}

.task-form input,
.task-form select{
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
}

.add-btn{
    background:#22c55e;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.search-box{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:20px;
}

.task-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.task{
    background:rgba(255,255,255,0.1);
    padding:18px;
    border-radius:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    border-left:5px solid #38bdf8;
}

.task.high{
    border-color:#ef4444;
}

.task.medium{
    border-color:#f59e0b;
}

.task.low{
    border-color:#22c55e;
}

.task-info h3{
    margin-bottom:5px;
}

.task small{
    opacity:0.8;
}

.actions{
    display:flex;
    gap:10px;
}

.actions button{
    border:none;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-weight:500;
}

.complete-btn{
    background:#22c55e;
}

.delete-btn{
    background:#ef4444;
}

.edit-btn{
    background:#3b82f6;
}

.completed{
    opacity:0.6;
    text-decoration:line-through;
}

.analytics h2{
    margin-bottom:20px;
}

.progress-container{
    margin-bottom:20px;
}

.progress-label{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.progress-bar{
    height:12px;
    background:#334155;
    border-radius:10px;
    overflow:hidden;
}

.progress{
    height:100%;
    background:#38bdf8;
    width:0%;
    transition:0.5s;
}

.clock{
    text-align:center;
    margin-top:30px;
}

.clock h1{
    font-size:42px;
}

.light-mode{
    background:#f1f5f9;
    color:#111827;
}

.light-mode .card,
.light-mode .task-section,
.light-mode .analytics{
    background:white;
    color:black;
}

@media(max-width:900px){

    .main{
        grid-template-columns:1fr;
    }

    .task-form{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1 class="title">🚀 Smart Task Management Dashboard</h1>
        <button class="theme-btn" onclick="toggleTheme()">Toggle Theme</button>
    </div>

    <div class="dashboard">

        <div class="card">
            <h2>Total Tasks</h2>
            <p id="totalTasks">0</p>
        </div>

        <div class="card">
            <h2>Completed</h2>
            <p id="completedTasks">0</p>
        </div>

        <div class="card">
            <h2>Pending</h2>
            <p id="pendingTasks">0</p>
        </div>

        <div class="card">
            <h2>Productivity</h2>
            <p id="productivity">0%</p>
        </div>

    </div>

    <div class="main">

        <div class="task-section">

            <div class="task-form">

                <input type="text" id="taskInput" placeholder="Task Title">

                <input type="date" id="taskDate">

                <select id="priority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>

                <button class="add-btn" onclick="addTask()">Add</button>

            </div>

            <input type="text"
                   class="search-box"
                   id="search"
                   placeholder="Search tasks..."
                   onkeyup="displayTasks()">

            <div class="task-list" id="taskList"></div>

        </div>

        <div class="analytics">

            <h2>📊 Analytics</h2>

            <div class="progress-container">

                <div class="progress-label">
                    <span>Task Completion</span>
                    <span id="progressText">0%</span>
                </div>

                <div class="progress-bar">
                    <div class="progress" id="progressBar"></div>
                </div>

            </div>

            <div class="clock">
                <h1 id="clock"></h1>
                <p>Current Time</p>
            </div>

        </div>

    </div>

</div>

<script>

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function saveTasks(){
    localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addTask(){

    const title = document.getElementById("taskInput").value;
    const date = document.getElementById("taskDate").value;
    const priority = document.getElementById("priority").value;

    if(title.trim() === ""){
        alert("Please enter task title");
        return;
    }

    tasks.push({
        id:Date.now(),
        title,
        date,
        priority,
        completed:false
    });

    saveTasks();

    document.getElementById("taskInput").value = "";

    displayTasks();
}

function displayTasks(){

    const taskList = document.getElementById("taskList");
    const search = document.getElementById("search").value.toLowerCase();

    taskList.innerHTML = "";

    const filteredTasks = tasks.filter(task =>
        task.title.toLowerCase().includes(search)
    );

    filteredTasks.forEach(task => {

        const div = document.createElement("div");

        div.className = `task ${task.priority}`;

        if(task.completed){
            div.classList.add("completed");
        }

        div.innerHTML = `

            <div class="task-info">
                <h3>${task.title}</h3>
                <small>
                    📅 ${task.date || "No Date"} |
                    🔥 ${task.priority.toUpperCase()}
                </small>
            </div>

            <div class="actions">

                <button class="complete-btn"
                    onclick="toggleComplete(${task.id})">

                    ${task.completed ? "Undo" : "Done"}

                </button>

                <button class="edit-btn"
                    onclick="editTask(${task.id})">

                    Edit

                </button>

                <button class="delete-btn"
                    onclick="deleteTask(${task.id})">

                    Delete

                </button>

            </div>

        `;

        taskList.appendChild(div);

    });

    updateDashboard();
}

function toggleComplete(id){

    tasks = tasks.map(task => {

        if(task.id === id){
            task.completed = !task.completed;
        }

        return task;
    });

    saveTasks();

    displayTasks();
}

function deleteTask(id){

    tasks = tasks.filter(task => task.id !== id);

    saveTasks();

    displayTasks();
}

function editTask(id){

    const newTask = prompt("Edit Task");

    if(newTask){

        tasks = tasks.map(task => {

            if(task.id === id){
                task.title = newTask;
            }

            return task;
        });

        saveTasks();

        displayTasks();
    }
}

function updateDashboard(){

    const total = tasks.length;

    const completed = tasks.filter(task => task.completed).length;

    const pending = total - completed;

    const productivity =
        total === 0
        ? 0
        : Math.round((completed / total) * 100);

    document.getElementById("totalTasks").innerText = total;
    document.getElementById("completedTasks").innerText = completed;
    document.getElementById("pendingTasks").innerText = pending;
    document.getElementById("productivity").innerText =
        productivity + "%";

    document.getElementById("progressBar").style.width =
        productivity + "%";

    document.getElementById("progressText").innerText =
        productivity + "%";
}

function toggleTheme(){

    document.body.classList.toggle("light-mode");
}

function updateClock(){

    const now = new Date();

    const time = now.toLocaleTimeString();

    document.getElementById("clock").innerText = time;
}

setInterval(updateClock,1000);

updateClock();

displayTasks();

</script>

</body>
</html>
